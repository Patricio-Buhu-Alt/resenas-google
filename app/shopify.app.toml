# Configuración de la app "resenas-google" (se despliega con: shopify app deploy)
# client_id y application_url se completan al vincular: shopify app config link

client_id = "PEGA_AQUI_EL_CLIENT_ID"
name = "resenas-google"
application_url = "https://resenas-google.onrender.com"
embedded = false

[build]
include_config_on_deploy = true

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = [ "https://resenas-google.onrender.com/auth/callback" ]

[webhooks]
api_version = "2025-07"

[app_proxy]
url = "https://resenas-google.onrender.com/proxy"
subpath = "resenas"
prefix = "apps"
