# Configuración de la app "resenas-google" (se sube con: npx shopify app deploy)
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2f7b841bce5fcba1822adc523a78fd87"
application_url = "https://resenas-google.onrender.com"
embedded = false
name = "resenas-google"

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = [ "https://resenas-google.onrender.com/auth/callback" ]

[webhooks]
api_version = "2025-07"

# Publica la API de Render en www.buhu.cl/apps/resenas
[app_proxy]
url = "https://resenas-google.onrender.com/proxy"
subpath = "resenas"
prefix = "apps"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
